name: CI & Release Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore DiarioLivre.sln

      - name: Build solution
        run: dotnet build DiarioLivre.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test DiarioLivre.sln --no-build --configuration Release --verbosity normal

  package-windows:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish standalone Windows executable
        shell: pwsh
        run: ./scripts/publish-windows.ps1

      - name: Upload Windows standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiarioLivre-win-x64
          path: publish/win-x64/**
